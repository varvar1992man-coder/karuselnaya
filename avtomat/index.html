<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Автомат каруселей — Карусельная</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../fonts.css">
<style>
:root{--bg:#F1E8D6;--panel:#FBF6EC;--ink:#211B15;--muted:#6B5F50;--red:#C8241E;--red-d:#8E1612;--line:#DCCFB8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.card{width:100%;max-width:460px;background:var(--panel);border:4px solid var(--red);outline:2px solid var(--red);outline-offset:4px;border-radius:8px;padding:26px 22px}
.sign{font-family:"Ruslan Display",Oswald,Georgia,serif;color:var(--red);text-transform:uppercase;font-size:28px;letter-spacing:.05em;text-align:center;margin:0}
.sub{font-family:Oswald,"Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;font-size:13px;margin:4px 0 20px}
label{display:block;font-weight:600;margin:0 0 6px}
input{width:100%;font:600 18px/1.2 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;padding:14px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-transform:uppercase}
input:focus{outline:none;border-color:var(--red)}
.btn{width:100%;margin-top:12px;background:var(--red);color:#fff;border:3px solid var(--red-d);border-radius:12px;padding:14px;font:400 18px/1 "Ruslan Display",Oswald,Georgia,serif;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;box-shadow:0 4px 0 var(--red-d)}
.btn:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--red)}
.muted{color:var(--muted);font-size:14px}
a{color:var(--red)}
hr{border:0;border-top:1px dashed var(--line);margin:20px 0}
[hidden]{display:none!important}
</style></head>
<body>
<main class="card">
  <p class="sign">Карусельная</p>
  <p class="sub">Автомат каруселей · вход по коду</p>

  <form id="f">
    <label for="code">Код доступа</label>
    <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="KR-123456789-ABCD2345" required>
    <button class="btn" id="go">Открыть автомат</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
  <p class="muted">Код приходит сразу после оплаты на странице «Спасибо за покупку». Ещё нет доступа? <a href="../#price">Купить</a></p>

  <hr>
  <div id="restore">
    <p class="muted"><b>Потеряла код?</b> Введи номер заказа из письма Робокассы — покажем код снова.</p>
    <form id="r">
      <input id="inv" inputmode="numeric" placeholder="Номер заказа, например 123456789">
      <button class="btn" id="rgo">Восстановить код</button>
      <p class="msg" id="rmsg" role="status"></p>
    </form>
  </div>
</main>
<script>
(() => {
const API = 'https://karuselnaya-shop.vercel.app/api';
const LS = 'karuselnaya_code';
const $ = id => document.getElementById(id);
const store = { get(){ try { return localStorage.getItem(LS) || ''; } catch(e){ return ''; } }, set(v){ try { localStorage.setItem(LS, v); } catch(e){} }, del(){ try { localStorage.removeItem(LS); } catch(e){} } };
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// Расшифровка: встроенная криптография браузера, а если её нет (старый браузер или http) — запасная библиотека.
const bin = u => { let s = ''; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return s; };
const loadForge = () => window.forge ? Promise.resolve() : new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/forge/1.3.1/forge.min.js'; sc.onload = ok; sc.onerror = () => bad(new Error('Не загрузилась библиотека расшифровки. Проверь интернет.')); document.head.appendChild(sc); });
async function decrypt(keyBytes, buf) {
  const iv = buf.subarray(0, 12), data = buf.subarray(12);
  if (window.crypto && crypto.subtle) {
    const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data));
  }
  await loadForge();
  const f = window.forge, tag = data.subarray(data.length - 16), ct = data.subarray(0, data.length - 16);
  const d = f.cipher.createDecipher('AES-GCM', f.util.createBuffer(bin(keyBytes)));
  d.start({ iv: bin(iv), tag: f.util.createBuffer(bin(tag)) });
  d.update(f.util.createBuffer(bin(ct)));
  if (!d.finish()) throw new Error('Не получилось открыть автомат. Обнови страницу.');
  return f.util.decodeUtf8(d.output.getBytes());
}

async function openMachine(code, auto) {
  code = String(code || '').trim().toUpperCase().replace(/\s+/g, '');
  if (!code) return;
  $('go').disabled = true; $('msg').style.color = 'var(--muted)'; $('msg').textContent = 'Открываю автомат…';
  try {
    const r = await fetch(API + '/key', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.key) throw new Error(j.error || 'Код не подошёл.');
    const buf = new Uint8Array(await (await fetch('machine.bin', { cache: 'no-cache' })).arrayBuffer());
    const html = await decrypt(b64(j.key), buf);
    store.set(code);
    if (location.search) history.replaceState(null, '', location.pathname);
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (auto) store.del();
    $('msg').style.color = 'var(--red)';
    $('msg').textContent = (e && e.message && !/fetch|network/i.test(e.message)) ? e.message : 'Нет связи. Проверь интернет и попробуй ещё раз.';
    $('go').disabled = false;
  }
}

$('f').addEventListener('submit', e => { e.preventDefault(); openMachine($('code').value, false); });
$('r').addEventListener('submit', async e => {
  e.preventDefault();
  const inv = $('inv').value.replace(/\D/g, '');
  if (!inv) return;
  $('rgo').disabled = true; $('rmsg').style.color = 'var(--muted)'; $('rmsg').textContent = 'Проверяю заказ…';
  try {
    const j = await (await fetch(API + '/restore?inv=' + inv)).json();
    if (!j.ok) throw new Error(j.error || 'Не нашли заказ.');
    $('code').value = j.code; $('rmsg').style.color = 'var(--ink)';
    $('rmsg').innerHTML = 'Твой код: <b></b>. Сохрани его и нажми «Открыть автомат».';
    $('rmsg').querySelector('b').textContent = j.code;
  } catch (err) { $('rmsg').style.color = 'var(--red)'; $('rmsg').textContent = err.message || 'Не получилось, попробуй позже.'; }
  $('rgo').disabled = false;
});

const fromUrl = new URLSearchParams(location.search).get('code');
const saved = fromUrl || store.get();
if (saved) { $('code').value = saved; openMachine(saved, !fromUrl); }
})();
</script>
</body></html>
