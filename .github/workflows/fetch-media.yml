name: fetch-media
on:
  push:
    branches: [media-tmp]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p media
          while read -r name url; do
            [ -n "$url" ] && curl -sSL --retry 3 -o "media/$name" "$url"
          done < urls.txt
          ls -la media
          git config user.name "media-bot"
          git config user.email "media-bot@users.noreply.github.com"
          git add media
          git commit -m "fetched media [skip ci]" || true
          git push
